<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Hadir ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff4e8a, #ff9ecf);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    margin-top: 10%;
}

h1 {
    font-size: 3em;
    animation: glow 2s infinite alternate;
}

p {
    font-size: 1.5em;
}

button {
    padding: 15px 35px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

#yesBtn {
    background-color: white;
    color: #ff4e8a;
}

#yesBtn:hover {
    background-color: #ff4e8a;
    color: white;
    transform: scale(1.2);
}

#noBtn {
    background-color: #ff1e63;
    color: white;
    position: absolute;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 30px white; }
}

.heart {
    position: absolute;
    color: white;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}

#countdown {
    font-size: 1.3em;
    margin-top: 20px;
}

.firework {
    position: absolute;
    font-size: 30px;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(3); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hadir ❤️</h1>
    <p>Will you be my Valentine? 💍</p>
    <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button id="noBtn">No 😢</button>
    <div id="countdown"></div>
</div>

<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>

let yourName = "Abdessalem ❤️";

// YES button action
function sayYes() {
    document.body.innerHTML = `
        <h1 style="margin-top:20%; font-size:3em;">Hadir 💖</h1>
        <p style="font-size:1.5em;">
        You just made me the happiest man alive! ❤️<br>
        Forever yours,<br>
        ${yourName}
        </p>
    `;
    startFireworks();
}

// Fireworks effect
function startFireworks() {
    setInterval(() => {
        const firework = document.createElement("div");
        firework.classList.add("firework");
        firework.innerHTML = "💖";
        firework.style.left = Math.random() * 100 + "vw";
        firework.style.top = Math.random() * 100 + "vh";
        document.body.appendChild(firework);
        setTimeout(() => firework.remove(), 1000);
    }, 200);
}

// NO button runs away
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 300);

// Countdown
const countdown = document.getElementById("countdown");
const nextValentine = new Date("February 14, 2026 00:00:00").getTime();

setInterval(function() {
    const now = new Date().getTime();
    const distance = nextValentine - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

    countdown.innerHTML = "Countdown to our special day: " + 
        days + "d " + hours + "h " + minutes + "m ❤️";
}, 1000);

</script>

</body>
</html>
